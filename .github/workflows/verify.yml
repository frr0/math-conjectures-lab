name: Verify Conjectures

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: python-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository and Python verifiers
        run: python3 scripts/check_repo.py

      - name: Build GitHub Pages site
        run: python3 scripts/build_site.py

  lean-checks:
    name: lean-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean 4)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Lean build artifacts
        uses: actions/cache@v4
        with:
          path: |
            lean/.lake
            ~/.elan
          key: lean-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml', 'lean/lake-manifest.json') }}

      - name: Fetch Mathlib cache
        run: |
          cd lean
          lake update
          lake exe cache get

      - name: Build Lean 4 and run kernel axiom audit
        run: bash scripts/verify_lean.sh
